# Builds the installers when a version tag is pushed (git tag v0.2.0 && git
# push --tags) and leaves them in a draft release. Nobody gets the update
# until the draft is published on GitHub, so a build can be tried first.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag and every version agree
        shell: bash
        run: |
          CONF=$(node -p 'require("./tauri.conf.json").version')
          CARGO=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$CONF" != "$CARGO" ] || [ "v$CONF" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tauri.conf.json $CONF, Cargo.toml $CARGO and tag $GITHUB_REF_NAME must agree"; exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          # Rebuilding the manual pages after every package is most of the wait.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Lens __VERSION__
          releaseBody: Lens __VERSION__
          releaseDraft: true
          args: ${{ matrix.args }}

  # One plainly named download per system, instead of everything a build makes.
  tidy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/release.ts "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
