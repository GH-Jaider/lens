<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens</title>
<style>
  :root {
    --bg: #fbfbfa; --text: #17171a; --muted: #6e6e78; --faint: #a3a3ab; --line: #e6e6e2; --card: #ffffff;
    --ok: #1f8a5b; --warn: #b26a0c;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101012; --text: #ededef; --muted: #8e8e98; --faint: #5c5c66; --line: #25252a; --card: #18181b; --ok: #4cc38a; --warn: #e2a336; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/18px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; cursor: default;
  }
  /* Every block has a fixed height, so nothing moves when the state changes. */
  main { width: 320px; margin: 0 auto; padding-top: 20px; }

  .stage {
    width: 320px; height: 320px; border-radius: 16px; border: 1px solid var(--line);
    background: #fff; position: relative; overflow: hidden;
  }
  .stage > * { position: absolute; inset: 0; transition: opacity 0.2s; }
  #qr { padding: 28px; }
  #qr svg { width: 100%; height: 100%; display: block; }
  #video { width: 100%; height: 100%; object-fit: contain; background: #000; opacity: 0; }
  #offline {
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 44px;
    background: var(--card); color: var(--muted); opacity: 0;
  }
  .badge {
    inset: 12px auto auto 12px; height: 24px; padding: 0 10px 0 9px; border-radius: 12px; display: flex; align-items: center; gap: 7px;
    background: rgba(0, 0, 0, 0.62); color: #f4f4f5; font-size: 12px; font-weight: 500; opacity: 0;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #4cc38a; }
  #eye {
    inset: 10px 10px auto auto; width: 28px; height: 28px; border-radius: 50%; border: 0; padding: 0;
    display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.62); color: #f4f4f5;
    opacity: 0; pointer-events: none;
  }
  #eye svg { width: 16px; height: 16px; }
  #eye.on { opacity: 1; pointer-events: auto; }
  #eye .shut, #eye.off .open { display: none; }
  #eye.off .shut { display: block; }
  .stage.live #video, .stage.live .badge, .stage.offline #offline { opacity: 1; }
  .stage.offline #qr, .stage.live #qr { opacity: 0; }

  .head { margin-top: 20px; height: 24px; display: flex; align-items: center; justify-content: space-between; }
  h1 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: -0.012em; white-space: nowrap; }
  #update { width: auto; height: 24px; padding: 0 10px; visibility: hidden; }
  #update.on { visibility: visible; }
  .head > div { position: relative; display: flex; align-items: center; }
  #version { position: absolute; right: 0; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }

  ol { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--line); }
  li { height: 52px; display: grid; grid-template-columns: 32px 1fr; align-items: center; border-bottom: 1px solid var(--line); }
  .mark {
    width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500; font-style: normal; color: var(--muted); border: 1px solid var(--faint);
  }
  /* A status row keeps the number's slot and puts a dot in it. */
  .mark.dot { border-color: transparent; }
  .mark.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .mark.ok::before { background: var(--ok); }
  .mark.warn::before { background: var(--warn); }
  li b, li span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li b { font-weight: 500; }
  li span { font-size: 12px; line-height: 17px; color: var(--muted); }

  footer { margin-top: 14px; height: 32px; display: flex; align-items: center; justify-content: space-between; }
  #foot { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  #foot::before { content: ""; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: var(--faint); }
  #foot.ok::before { background: var(--ok); }
  #foot.warn::before { background: var(--warn); }
  /* With a phone connected the rows above already say it. */
  #foot.said { visibility: hidden; }
  button {
    width: 112px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); font: inherit; font-size: 12px; font-weight: 500; cursor: default; padding: 0;
  }
  button:active { opacity: 0.65; }
  footer > div:last-child { display: flex; align-items: center; gap: 10px; }
  #cup { width: 28px; height: 28px; border: 0; background: transparent; color: var(--faint); display: flex; align-items: center; justify-content: center; }
  #cup:hover { color: var(--text); }
  #cup svg { width: 17px; height: 17px; }
</style>
</head>
<body>
<main>
  <div class="stage" id="stage">
    <div id="qr"></div>
    <div id="offline"></div>
    <video id="video" autoplay muted playsinline></video>
    <div class="badge" id="badge"></div>
    <button id="eye">
      <svg class="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.7a8.7 8.7 0 0 1 2-.2c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-2.4 3.2M6.2 7.4A15.600 15.600 0 0 0 2.500 12S6 18.500 12 18.500a8.800 8.800 0 0 0 4.300-1.100"/><path d="M9.900 9.900a3 3 0 0 0 4.200 4.200"/><path d="M3.500 3.500l17 17"/></svg>
    </button>
  </div>

  <div class="head"><h1 id="title"></h1><div><span id="version"></span><button id="update"></button></div></div>

  <ol>
    <li><i class="mark" id="m1"></i><div><b id="a1"></b><span id="b1"></span></div></li>
    <li><i class="mark" id="m2"></i><div><b id="a2"></b><span id="b2"></span></div></li>
    <li><i class="mark" id="m3"></i><div><b id="a3"></b><span id="b3"></span></div></li>
  </ol>

  <footer>
    <div id="foot"></div>
    <div>
      <button id="cup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.500 9h12v5.500a4.500 4.500 0 0 1-4.500 4.500h-3a4.500 4.500 0 0 1-4.500-4.500z"/><path d="M16.500 10.500h1.300a2.200 2.200 0 0 1 0 4.400h-1.300"/><path d="M8.500 3.500v2.500M12.500 3.500v2.500"/></svg>
      </button>
      <button id="copy"></button>
    </div>
  </footer>
</main>

<script src="/app.js"></script>
</body>
</html>
