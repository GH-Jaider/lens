<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Lens</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #f4f4f5; overflow: hidden; }
  body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; }

  .status {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); left: calc(14px + env(safe-area-inset-left));
    display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 15px;
    background: rgba(0, 0, 0, 0.6); font-size: 13px; font-weight: 500;
  }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #8b8b95; }
  .status.live::before { background: #4cc38a; }

  /* The camera's controls: a strip that is always there, as on a camera. Each
     setting shows its value; the one being changed opens just above. */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: env(safe-area-inset-bottom);
    background: rgba(18, 18, 20, 0.86); border-top: 1px solid rgba(255, 255, 255, 0.1);
  }
  .editor {
    display: none; align-items: center; justify-content: center; gap: 14px; height: 56px;
    padding: 0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  body.editing .editor { display: flex; }
  .editor output { flex: none; width: 64px; text-align: right; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .strip { display: flex; align-items: center; height: 64px; padding-left: calc(12px + env(safe-area-inset-left)); }
  .round {
    flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.24);
    background: transparent; color: #f4f4f5; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .round svg { width: 21px; height: 21px; }
  .round:active { opacity: 0.6; }
  .chips { flex: 1; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 0 10px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; min-width: 70px; height: 48px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: inherit;
  }
  .chip span { font-size: 11px; color: #8e8e98; white-space: nowrap; }
  .chip b { font-size: 14px; font-weight: 600; color: #f4f4f5; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip.on { background: rgba(255, 255, 255, 0.13); }
  .seg { display: flex; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 8px; overflow: hidden; }
  .seg button { height: 34px; min-width: 64px; padding: 0 14px; border: 0; border-left: 1px solid rgba(255, 255, 255, 0.16); background: transparent; color: #c9c9cf; font: inherit; font-size: 14px; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: #f4f4f5; color: #111113; font-weight: 600; }
  input[type="range"] { flex: 1; min-width: 0; margin: 0; accent-color: #f4f4f5; }

  .notice {
    position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 0 36px; text-align: center; background: #000;
  }
  .notice p { margin: 0; max-width: 300px; }
  .notice button {
    height: 44px; padding: 0 22px; border-radius: 10px; border: 0; background: #f4f4f5; color: #111113;
    font: inherit; font-weight: 600;
  }
  body.notice-on .notice { display: flex; }
  body.notice-on .dock, body.notice-on .status { display: none; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<div class="status" id="status"></div>
<div class="dock">
  <div class="editor" id="editor"></div>
  <div class="strip">
    <button class="round" id="flip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a8 8 0 0 1 14.5-3.5L20 7"/><path d="M20 3v4h-4"/><path d="M20 15a8 8 0 0 1-14.5 3.5L4 17"/><path d="M4 21v-4h4"/></svg>
    </button>
    <div class="chips" id="chips"></div>
  </div>
</div>
<div class="notice"><p id="notice"></p><button id="retry"></button></div>
<script src="/phone.js"></script>
</body>
</html>
